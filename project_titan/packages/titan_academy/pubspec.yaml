version: 0.1.0
publish_to: none

environment:
  sdk: "^3.3.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  titan_core:
    path: ../titan_core
  titan_domain:
    path: ../titan_domain
  titan_identity:
    path: ../titan_identity
  titan_learning_profile:
    path: ../titan_learning_profile
