name: titan_video
description: Professional Video Learning Engine for Project TITAN built on top of titan_learning_content.
version: 0.1.0
publish_to: none

environment:
  sdk: "^3.3.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  titan_core:
    path: ../titan_core
  titan_domain:
    path: ../titan_domain
  titan_storage:
    path: ../titan_storage
  titan_learning_content:
    path: ../titan_learning_content
