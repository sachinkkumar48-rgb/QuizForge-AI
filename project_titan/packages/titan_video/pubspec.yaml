    path: ../titan_revision
  titan_knowledge_graph:
    path: ../titan_knowledge_graph
  titan_ai_mentor:
    path: ../titan_ai_mentor
  titan_search:
    path: ../titan_search
  titan_analytics:
    path: ../titan_analytics

dev_dependencies:
