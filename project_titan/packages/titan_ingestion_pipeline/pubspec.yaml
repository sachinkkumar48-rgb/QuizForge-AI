    path: ../titan_notes
  titan_kmp:
    path: ../titan_kmp
  titan_analytics:
    path: ../titan_analytics
  titan_content_authoring:
    path: ../titan_content_authoring
  titan_question_bank:
    path: ../titan_question_bank
