name: titan_smart_assessment
description: Smart Assessment Engine package for Project TITAN providing unified practice tests, topic tests, mock exams, adaptive assessments, PYQs, AI-generated tests, and performance analytics.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.9.1
  titan_ai_mentor:
    path: ../titan_ai_mentor
  titan_ai_tutor:
    path: ../titan_ai_tutor
  titan_analytics:
    path: ../titan_analytics
  titan_core:
    path: ../titan_core
  titan_dashboard:
    path: ../titan_dashboard
  titan_domain:
    path: ../titan_domain
  titan_knowledge_graph:
    path: ../titan_knowledge_graph
  titan_learning_content:
    path: ../titan_learning_content
  titan_learning_profile:
    path: ../titan_learning_profile
  titan_notes:
    path: ../titan_notes
  titan_planner:
    path: ../titan_planner
  titan_quiz:
    path: ../titan_quiz
  titan_quiz_ai:
    path: ../titan_quiz_ai
  titan_recommendation:
    path: ../titan_recommendation
  titan_revision:
    path: ../titan_revision
  titan_search:
    path: ../titan_search
  titan_video:
