name: titan_reader
description: TITAN Reader - professional PDF reader, document management, dictionary, grammar and AI reading assistant application for Project TITAN.
version: 0.1.0+1
publish_to: none

environment:
  sdk: "^3.3.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  meta: ^1.11.0
  pdfrx: ^2.4.7
  titan_core:
    path: ../../packages/titan_core
  titan_domain:
    path: ../../packages/titan_domain
  titan_storage:
    path: ../../packages/titan_storage
  titan_pdf:
    path: ../../packages/titan_pdf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
