name: Project TITAN CI Pipeline

on:
  push:
    branches: [ main, develop, 'release/*', 'garuda/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  flutter-validation:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Restore Flutter Pub Cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Quality Gate 1 - Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/

      - name: Quality Gate 2 - Flutter Unit & Widget Tests
        run: flutter test --coverage

      - name: Setup Java 17 for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Release Signing (If Keystore Provided)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=../upload-keystore.jks" >> android/key.properties
            echo "Release keystore configured from GitHub Secrets."
          else
            echo "No signing secret configured; building release bundle with fallback key."
          fi

      - name: Quality Gate 3 - Build Release App Bundle (AAB)
        run: flutter build appbundle --release --no-pub

      - name: Verify Release AAB Artifact
        shell: bash
        run: |
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "Release AAB build verified successfully:"
            ls -lh build/app/outputs/bundle/release/app-release.aab
          else
            echo "ERROR: build/app/outputs/bundle/release/app-release.aab was not generated!"
            exit 1
          fi

      - name: Archive Production Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Cleanup Sensitive Signing Files
        if: always()
        shell: bash
        run: |
          rm -f android/upload-keystore.jks android/key.properties
          echo "Sensitive signing files sanitized from runner workspace."

  python-backend-validation:
    name: Python Backend Test & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quality Gate 3 - Python Compileall
        run: python -m compileall app

      - name: Quality Gate 4 - Pytest Benchmark & Unit Tests
        run: python -m pytest --cov=app --cov-report=xml

  docker-compose-validation:
    name: Docker Container & Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Quality Gate 5 - Docker Compose Configuration Validation
        run: docker compose config

      - name: Quality Gate 6 - Docker Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: titan-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
