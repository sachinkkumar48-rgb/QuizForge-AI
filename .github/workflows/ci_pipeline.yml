name: Project TITAN CI Pipeline

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  flutter-validation:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Restore Flutter Pub Cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Quality Gate 1 - Flutter Analyze
        run: flutter analyze lib/

      - name: Quality Gate 2 - Flutter Unit & Widget Tests
        run: flutter test --coverage

  python-backend-validation:
    name: Python Backend Test & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quality Gate 3 - Python Compileall
        run: python -m compileall app

      - name: Quality Gate 4 - Pytest Benchmark & Unit Tests
        run: python -m pytest --cov=app --cov-report=xml

  docker-compose-validation:
    name: Docker Container & Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Quality Gate 5 - Docker Compose Configuration Validation
        run: docker compose config

      - name: Quality Gate 6 - Docker Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: titan-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
