name: TITAN PR-Agent AI Reviewer

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  issue_comment:
    types:
      - created

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent:
    name: AI Pull Request Review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/')) }}
    steps:
      - name: PR-Agent Review Action
        uses: the-pr-agent/pr-agent@v0.41.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: "gemini/gemini-2.0-flash"
          config.fallback_models: '["gemini/gemini-1.5-flash"]'
