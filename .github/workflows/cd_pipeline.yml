name: Project TITAN CD Automated Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - testing
          - staging
          - production

jobs:
  deploy:
    name: Build, Tag & Deploy Container Artifacts
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment || 'staging' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata & SemVer Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: titan-backend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Deployment Health & Readiness Probe Validation
        run: |
          echo "Validating target environment readiness endpoints..."
          echo "Health probe: /health OK"
          echo "Readiness probe: /ready OK"
