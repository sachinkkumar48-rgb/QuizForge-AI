version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titan_backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - titan_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    container_name: titan_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titan_password_change_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-titan_lms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titan_user} -d ${POSTGRES_DB:-titan_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - titan_internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  nginx:
    image: nginx:alpine
    container_name: titan_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      # - "443:443" # Uncomment when HTTPS is enabled
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - certbot_etc:/etc/letsencrypt:ro # Uncomment for Let's Encrypt certificates
      # - certbot_www:/var/www/certbot:ro # Uncomment for Certbot ACME webroot challenge
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    networks:
      - titan_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  titan_internal:
    driver: bridge

volumes:
  postgres_data:
#   certbot_etc:
#   certbot_www:
