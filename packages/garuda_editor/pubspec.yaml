name: garuda_editor
description: GARUDA Editorial Studio Package for Project TITAN. Internal workspace for managing Knowledge Objects, evidence inbox, link review, versioning, and publishing.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  garuda_evidence:
    path: ../garuda_evidence
  garuda_graph:
    path: ../garuda_graph
  garuda_pyq:
    path: ../garuda_pyq

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
