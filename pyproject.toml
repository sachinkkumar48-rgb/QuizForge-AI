[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quizforge-ai"
version = "0.1.0"
description = "QuizForge AI & GARUDA Master Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "cffi==2.1.0",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "colorama==0.4.6",
    "distro==1.9.0",
    "fastapi==0.141.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "pyasn1==0.6.4",
    "pyasn1_modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "sniffio==1.3.1",
    "starlette==1.3.1",
    "tenacity==9.1.4",
    "typing-inspection==0.4.2",
    "typing_extensions==4.16.0",
    "urllib3==2.7.0",
    "uvicorn==0.52.0",
    "websockets==16.1.1"
]

[tool.pyrefly]
python-path = ".venv/Scripts/python.exe"
venv-path = "."
venv = ".venv"
search-paths = [
    ".venv/Lib/site-packages",
    ".",
    "app"
]
project-roots = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".venv/Lib/site-packages",
    ".",
    "app"
]
executionEnvironments = [
  { root = ".", pythonVersion = "3.14", extraPaths = [".venv/Lib/site-packages", ".", "app"] }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
    ".",
    "app",
    ".venv/Lib/site-packages"
]
